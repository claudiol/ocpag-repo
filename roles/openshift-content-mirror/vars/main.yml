---
# vars file for openshift-content-mirror
os_platforms:
  linux: "openshift-client-linux-{{ ocp_version }}.tar.gz"
  macos: "openshift-client-mac-{{ ocp_version }}.tar.gz"
  windows: "openshift-client-windows-{{ ocp_version }}.zip"
openshift_content_mirror_ocp_client_download_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp
container_files:
  - https://openshift-packages.s3.us-west-2.amazonaws.com/containers/nginx.tar
  - https://openshift-packages.s3.us-west-2.amazonaws.com/containers/registry.tar

openshift_content_mirror_container_images:
  - docker.io/nginx:mainline-perl
