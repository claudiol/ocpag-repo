name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install containers.podman:1.20.2
      - name: Syntax-check playbooks
        run: |
          for playbook in \
            generate.yml \
            generate-bundle.yml \
            generate-certified-operators.yml \
            generate-community-operators.yml \
            generate-rh-operators.yml \
            ansible/site.yml
          do
            ansible-playbook --syntax-check "$playbook"
          done
      - name: ansible-lint
        run: |
          ansible-lint --offline \
            generate.yml \
            generate-bundle.yml \
            generate-certified-operators.yml \
            generate-community-operators.yml \
            generate-rh-operators.yml \
            ansible/site.yml \
            roles
      - name: yamllint
        run: yamllint .
      - name: Shell syntax
        run: |
          bash -n create-bundle.sh
          find scripts roles/create-ocp-bundles/build -name '*.sh' -exec bash -n {} +

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" detect --source . --redact --exit-code 1
      - name: Local credential files stay untracked
        run: |
          tracked=$(git ls-files -- .env pull-secret.txt gh_actions_variables.yml)
          if [ -n "$tracked" ]; then
            echo "These credential files are tracked:"
            printf '%s\n' "$tracked"
            exit 1
          fi
